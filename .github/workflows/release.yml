name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_version="${VERSION#v}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="pane_${release_version}_${os}_${arch}"
            binary="pane"
            if [ "${os}" = windows ]; then
              binary="pane.exe"
            fi

            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${build_date}" \
              -o "build/${name}/${binary}" ./cmd/pane

            if [ "${os}" = windows ]; then
              (cd "build/${name}" && zip -q "../../dist/${name}.zip" "${binary}")
            else
              tar -C "build/${name}" -czf "dist/${name}.tar.gz" "${binary}"
            fi
          done

          (cd dist && sha256sum ./* > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Pane ${GITHUB_REF_NAME}"
